# dart run flutter_native_splash:create
flutter_native_splash:
  android: true
  ios: true
  web: false
  color: "#FFFFFF"
  image: assets/images/app_icon.png

  # Android 12+ recorta el icono a un círculo de 2/3 del lienzo: el logo debe
  # ir centrado con margen, por eso se usa el foreground del icono adaptativo.
  android_12:
    image: assets/icons/app/app_icon_foreground.png
    color: "#FFFFFF"
