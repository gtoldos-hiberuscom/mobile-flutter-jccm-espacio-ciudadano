# PR Quality Gate — jccm_espacio_ciudadano
# Runs on every pull request targeting develop or main.
# Jobs: size_check (analyze + fatal warnings), dart_format, pubspec_check.
name: PR Quality Gate

on:
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # 1. Static analysis with fatal-infos and fatal-warnings
  # ──────────────────────────────────────────────────────────────────────────
  size_check:
    name: Analyze (fatal-infos + fatal-warnings)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ${{ env.PUB_CACHE }}
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Run build_runner (code generation)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Flutter analyze (fatal-infos + fatal-warnings)
        run: flutter analyze --fatal-infos --fatal-warnings

  # ──────────────────────────────────────────────────────────────────────────
  # 2. Dart format check
  # ──────────────────────────────────────────────────────────────────────────
  dart_format:
    name: Dart Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ${{ env.PUB_CACHE }}
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Check Dart formatting
        # Fails (non-zero exit) if any file under lib/ needs reformatting.
        run: dart format --output=none --set-exit-if-changed lib/

  # ──────────────────────────────────────────────────────────────────────────
  # 3. Pubspec dependency hygiene
  #    Ensures no git:// or path: dependencies land in a release build.
  # ──────────────────────────────────────────────────────────────────────────
  pubspec_check:
    name: Pubspec Dependency Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for git dependencies
        run: |
          echo "Checking for git: dependencies in pubspec.yaml..."
          if grep -E '^\s+git:' pubspec.yaml; then
            echo "::error file=pubspec.yaml::Found git: dependencies — not allowed in release builds."
            exit 1
          fi
          echo "No git: dependencies found. ✓"

      - name: Check for path dependencies
        run: |
          echo "Checking for path: dependencies in pubspec.yaml..."
          if grep -E '^\s+path:' pubspec.yaml; then
            echo "::error file=pubspec.yaml::Found path: dependencies — not allowed in release builds."
            exit 1
          fi
          echo "No path: dependencies found. ✓"
