# CI baseline — jccm_espacio_ciudadano
# Sprint 2 baseline (STORY-68): static analysis + format check + codegen verification + tests.
# Build/upload artifacts, store deploys, signed builds, integration tests and coverage reports
# are intentionally deferred to later sprints (see ADR-002 and the gating tickets STORY-66,
# STORY-67, TASK-69, TASK-70).
name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test:
    name: Analyze, codegen verify and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter (pinned to .fvmrc)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: Print Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Verify codegen produced no uncommitted changes
        run: git diff --exit-code

      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test
