group 'io.crossingthestreams.flutterappauth'
version '1.0-SNAPSHOT'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.6.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    // androidx.browser 1.9.0+ (ephemeral browsing APIs) requires compileSdk 36.
    compileSdkVersion 36

    if (project.android.hasProperty("namespace")) {
        namespace 'io.crossingthestreams.flutterappauth'
    }


    defaultConfig {
        minSdkVersion 24
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    lint {
        disable 'InvalidPackage'
    }
}

dependencies {
    implementation 'net.openid:appauth:0.11.1'
    // Ephemeral Custom Tabs support (setEphemeralBrowsingEnabled /
    // CustomTabsClient.isEphemeralBrowsingSupported). AppAuth 0.11.1 declares
    // androidx.browser:browser:1.3.0; Gradle resolves to the highest (1.10.0).
    implementation 'androidx.browser:browser:1.10.0'
}