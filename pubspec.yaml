name: jccm_espacio_ciudadano
description: "Carpeta Ciudadana CLM — citizen-facing mobile application for JCCM digital services."
publish_to: 'none'
version: 0.1.12+14

environment:
  sdk: ^3.10.1

dependencies:
  built_collection: ^5.1.1
  built_value: ^8.12.5
  connectivity_plus: ^6.1.0
  crypto: ^3.0.6
  curl_logger_dio_interceptor: ^1.0.1
  dio: ^5.9.2
  espacio_ciudadano_api:
    path: generated/dart_dio_client
  file_picker: ^11.0.0
  file_selector: ^1.0.3
  flutter:
    sdk: flutter
  flutter_appauth: ^12.0.0
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.3
  flutter_secure_storage: ^10.0.0
  local_auth: ^3.0.1
  local_auth_android: ^2.0.8
  flutter_svg: ^2.0.17
  freezed_annotation: ^3.1.0
  go_router: ^17.2.2
  intl: any
  logger: ^2.7.0
  meta: ^1.16.0
  package_info_plus: ^9.0.1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
dev_dependencies:
  custom_lint: ^0.8.1
  fake_async: ^1.3.3
  flutter_launcher_icons:
  flutter_lints: ^6.0.0
  flutter_native_splash:
  flutter_test:
    sdk: flutter
  freezed: ^3.2.2
  integration_test:
    sdk: flutter
  json_serializable: ^6.11.1
  # Pin exacto a la última versión implementada con `custom_lint`: a partir de
  # 3.1.0 riverpod_lint usa `analysis_server_plugin` (otro sistema de plugins,
  # con `dart analyze`), y además fija `riverpod` a su misma versión, así que
  # subirlo arrastraría flutter_riverpod 3.0.3 → 3.1.0. Al subir riverpod habrá
  # que migrar el cableado del linter a la vez.
  riverpod_lint: 3.0.3

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/icons/carnets/
    - assets/icons/carnets/discapacidad.svg
    - assets/icons/carnets/discapacidad.png
    - assets/icons/carnets/familia.svg
    - assets/icons/carnets/familia.png
    - assets/icons/carnets/joven.svg
    - assets/icons/carnets/logo_fondo.svg
    - assets/icons/carnets/download.svg
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700

# workspace:
#   - packages/clean_linter

flutter_launcher_icons:
  android: launcher_icon
  ios: true
  image_path: assets/icons/app/app_icon.png
  min_sdk_android: 21
  adaptive_icon_background: '#FFFFFF'
  adaptive_icon_foreground: assets/icons/app/app_icon_foreground.png
  adaptive_icon_foreground_inset: 0
