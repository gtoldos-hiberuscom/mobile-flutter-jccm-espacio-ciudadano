name: jccm_espacio_ciudadano
description: "Carpeta Ciudadana CLM — citizen-facing mobile application for JCCM digital services."
publish_to: 'none'
version: 0.1.7+9

environment:
  sdk: ^3.10.1

dependencies:
  built_collection: ^5.1.1
  built_value: ^8.12.5
  connectivity_plus: ^6.1.0
  crypto: ^3.0.6
  curl_logger_dio_interceptor: ^1.0.1
  dio: ^5.9.2
  espacio_ciudadano_api:
    path: generated/dart_dio_client
  file_picker: ^11.0.0
  file_selector: ^1.0.3
  flutter:
    sdk: flutter
  # Fork vendorizado. El unico delta son 2 ficheros del plugin Android
  # (`setEphemeralBrowsingEnabled` sobre la Custom Tab); iOS, macOS y Dart son
  # copia de upstream 12.0.0 sin tocar. Ver packages/flutter_appauth/CHANGELOG_JCCM.md
  # y docs/auth/.
  #
  # Por que vuelve: en Android el canal TLS con el IdP de certificado vive en el
  # perfil de Chrome y no lo suelta ni el logout ni esperar a que caduque la
  # ventana de Cl@ve (medido el 29/09, cuatro ciclos logout->login con auth_time
  # nuevo y sin volver a pedir certificado). Aislar el contenedor es la unica
  # palanca que llega ahi desde la app.
  flutter_appauth:
    path: packages/flutter_appauth
  # Pin EXACTO: el fork asume que ephemeralAsWebAuthenticationSession.index == 1.
  # Lo guarda test/features/auth/external_user_agent_contract_test.dart.
  flutter_appauth_platform_interface: 12.0.0
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.3
  flutter_secure_storage: ^10.0.0
  local_auth: ^3.0.1
  flutter_svg: ^2.0.17
  freezed_annotation: ^3.1.0
  go_router: ^17.2.2
  intl: any
  logger: ^2.7.0
  meta: ^1.16.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
dev_dependencies:
  custom_lint: ^0.8.1
  fake_async: ^1.3.3
  flutter_launcher_icons:
  flutter_lints: ^6.0.0
  flutter_native_splash:
  flutter_test:
    sdk: flutter
  freezed: ^3.2.2
  integration_test:
    sdk: flutter
  json_serializable: ^6.11.1
  # Pin exacto a la última versión implementada con `custom_lint`: a partir de
  # 3.1.0 riverpod_lint usa `analysis_server_plugin` (otro sistema de plugins,
  # con `dart analyze`), y además fija `riverpod` a su misma versión, así que
  # subirlo arrastraría flutter_riverpod 3.0.3 → 3.1.0. Al subir riverpod habrá
  # que migrar el cableado del linter a la vez.
  riverpod_lint: 3.0.3

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700

# workspace:
#   - packages/clean_linter
