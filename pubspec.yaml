name: jccm_espacio_ciudadano
description: "Carpeta Ciudadana CLM — citizen-facing mobile application for JCCM digital services."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.1

dependencies:
  dio: ^5.9.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.3
  flutter_secure_storage: ^10.0.0
  freezed_annotation: ^3.1.0
  go_router: ^17.2.2
  shared_preferences: ^2.5.5

dev_dependencies:
  build_runner: ^2.13.1
  custom_lint: ^0.8.1
  flutter_launcher_icons:
  flutter_lints: ^6.0.0
  flutter_native_splash:
  flutter_test:
    sdk: flutter
  freezed: ^3.2.2
  json_serializable: ^6.11.1
  riverpod_generator: ^3.0.3
  riverpod_lint: ^3.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - config_development.json
    - config_preproduction.json
    - config_production.json
    - assets/images/
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700

# workspace:
#   - packages/clean_linter
